name: Deploy HRMS Frontend Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-frontend-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          tar -czf ../hrms-frontend.tar.gz -C dist .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.HRMS_TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HRMS_TEST_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/hrms_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hrms_key ~/.ssh/known_hosts

      - name: Upload frontend
        env:
          DEPLOY_HOST: ${{ secrets.HRMS_TEST_HOST }}
          DEPLOY_USER: ${{ secrets.HRMS_TEST_USER }}
        run: |
          scp -i ~/.ssh/hrms_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            hrms-frontend.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/hrms-frontend.tar.gz"

      - name: Publish frontend
        env:
          DEPLOY_HOST: ${{ secrets.HRMS_TEST_HOST }}
          DEPLOY_USER: ${{ secrets.HRMS_TEST_USER }}
        run: |
          ssh -i ~/.ssh/hrms_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- '${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          release="/var/www/hrms/releases/$1"
          sudo install -d -m 755 "$release"
          sudo tar --no-same-owner -xzf /home/ubuntu/hrms-frontend.tar.gz -C "$release"
          sudo test -s "$release/index.html"
          sudo chmod -R a+rX "$release"
          sudo ln -s "$release" "/var/www/hrms/current-$1"
          sudo mv -Tf "/var/www/hrms/current-$1" /var/www/hrms/current
          rm -f /home/ubuntu/hrms-frontend.tar.gz
          echo "Frontend files published; verify through Nginx."
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/hrms_key